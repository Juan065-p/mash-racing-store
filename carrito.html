<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito — Mash Racing Store</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.29.0/dist/tabler-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="carrito">

  <!-- ANNOUNCE BAR -->
  <div class="announce-bar"></div>

  <!-- NAVBAR -->
  <nav class="navbar" role="navigation" aria-label="Navegación principal">
    <div class="nav-inner">
      <nav-logo-slot class="nav-logo-slot"></nav-logo-slot>

      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="tienda.html">Tienda</a></li>
        <li><a href="tienda.html?cat=ropa">F1 Ropa</a></li>
        <li><a href="tienda.html?cat=motogp">MotoGP</a></li>
        <li><a href="tienda.html?cat=escala">Escala</a></li>
      </ul>

      <div class="nav-actions">
        <a href="https://www.instagram.com/mash.racing2" target="_blank" rel="noopener"
           class="nav-icon-btn" aria-label="Instagram">
          <i class="ti ti-brand-instagram"></i>
        </a>
        <a href="carrito.html" class="nav-icon-btn" aria-label="Carrito" id="nav-cart-btn">
          <i class="ti ti-shopping-cart"></i>
          <span class="cart-count" id="cart-count"></span>
        </a>
        <button class="nav-burger" aria-label="Menú" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- MOBILE MENU -->
  <div class="mobile-menu" role="menu">
    <a href="index.html">Inicio</a>
    <a href="tienda.html">Tienda</a>
    <a href="tienda.html?cat=ropa">F1 Ropa</a>
    <a href="tienda.html?cat=motogp">MotoGP</a>
    <a href="tienda.html?cat=escala">Carros Escala</a>
    <a href="carrito.html">Carrito</a>
  </div>

  <!-- CART PAGE -->
  <main class="cart-page">
    <div class="container">
      <div style="margin-bottom:2rem">
        <div class="breadcrumb"><a href="index.html">Inicio</a> / <a href="tienda.html">Tienda</a> / <span>Carrito</span></div>
        <h1 class="section-title" style="margin-top:.5rem">Tu <span>carrito</span></h1>
      </div>
      <div id="cart-container"></div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p class="footer-copy">&copy; 2025 Mash Racing Store · Colombia</p>
        <div style="display:flex;gap:1rem">
          <a href="https://www.instagram.com/mash.racing2" target="_blank" rel="noopener"
             style="font-size:.78rem;color:var(--gray)">Instagram</a>
          <a href="https://wa.me/573156532989" target="_blank" rel="noopener"
             style="font-size:.78rem;color:var(--gray)">WhatsApp</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- TOAST -->
  <div class="toast" id="toast" role="alert" aria-live="polite">
    <i class="ti ti-circle-check"></i>
    <span id="toast-msg"></span>
  </div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
